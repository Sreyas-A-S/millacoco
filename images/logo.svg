<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B3F"/>
      <stop offset="25%" stop-color="#FDF0CD"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="75%" stop-color="#AA7C26"/>
      <stop offset="100%" stop-color="#F7E7BE"/>
    </linearGradient>

    <!-- Warm Amber Gold Gradient for Palm & Drop -->
    <linearGradient id="amberDrop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="35%" stop-color="#E5B558"/>
      <stop offset="75%" stop-color="#C28E2E"/>
      <stop offset="100%" stop-color="#845914"/>
    </linearGradient>

    <!-- Deep Luxury Royal Maroon Background Gradient -->
    <radialGradient id="maroonRadial" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#5A170D"/>
      <stop offset="60%" stop-color="#3D0E07"/>
      <stop offset="100%" stop-color="#230703"/>
    </radialGradient>

    <!-- Drop Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fully Transparent Background (No opaque rect) -->

  <!-- Outer Fine Filigree Ring -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#goldLinear)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Inner Elegant Border Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#goldLinear)" stroke-width="3"/>

  <!-- Four Cardinal Diamond Accents -->
  <path d="M 256,54 L 261,64 L 256,74 L 251,64 Z" fill="url(#goldLinear)"/>
  <path d="M 256,438 L 261,448 L 256,458 L 251,448 Z" fill="url(#goldLinear)"/>
  <path d="M 54,256 L 64,251 L 74,256 L 64,261 Z" fill="url(#goldLinear)"/>
  <path d="M 438,256 L 448,251 L 458,256 L 448,261 Z" fill="url(#goldLinear)"/>

  <!-- Central Palm & Coconut Crest Group -->
  <g id="crest" transform="translate(0, -6)">

    <!-- Ambient Glow Behind Crown -->
    <circle cx="256" cy="205" r="70" fill="#D4A853" opacity="0.12" filter="url(#goldGlow)"/>

    <!-- Arching Palm Fronds (Sculpted Luxury Vector Silhouette) -->
    <!-- Center Top Frond -->
    <path d="M 256,120 C 253,145 254,180 256,205 C 258,180 259,145 256,120 Z" fill="url(#goldLinear)"/>
    <path d="M 256,115 C 251,135 242,165 256,205 C 270,165 261,135 256,115 Z" fill="url(#amberDrop)" opacity="0.9"/>

    <!-- Left Top Arching Frond -->
    <path d="M 185,135 C 205,145 235,170 254,208 C 238,185 210,165 185,135 Z" fill="url(#goldLinear)"/>
    <!-- Left Leaf Serrations -->
    <path d="M 185,135 Q 212,152 232,185 Q 215,162 195,148 Z" fill="url(#amberDrop)"/>
    <path d="M 165,165 C 190,172 225,190 252,212 C 230,198 200,185 165,165 Z" fill="url(#goldLinear)"/>
    <path d="M 160,208 C 185,208 220,215 250,218 C 225,214 190,215 160,208 Z" fill="url(#amberDrop)"/>

    <!-- Right Top Arching Frond -->
    <path d="M 327,135 C 307,145 277,170 258,208 C 274,185 302,165 327,135 Z" fill="url(#goldLinear)"/>
    <!-- Right Leaf Serrations -->
    <path d="M 327,135 Q 300,152 280,185 Q 297,162 317,148 Z" fill="url(#amberDrop)"/>
    <path d="M 347,165 C 322,172 287,190 260,212 C 282,198 312,185 347,165 Z" fill="url(#goldLinear)"/>
    <path d="M 352,208 C 327,208 292,215 262,218 C 287,214 322,215 352,208 Z" fill="url(#amberDrop)"/>

    <!-- Curved Elegant Trunk -->
    <path d="M 252,215 C 253,245 250,285 244,325 L 268,325 C 262,285 259,245 260,215 Z" fill="url(#goldLinear)"/>
    <!-- Trunk Ring Textures -->
    <path d="M 251,235 Q 256,238 261,235" stroke="#4A1209" stroke-width="2.5" fill="none"/>
    <path d="M 249,255 Q 255,258 263,255" stroke="#4A1209" stroke-width="2.5" fill="none"/>
    <path d="M 248,275 Q 255,278 264,275" stroke="#4A1209" stroke-width="2.5" fill="none"/>
    <path d="M 246,295 Q 254,298 266,295" stroke="#4A1209" stroke-width="2.5" fill="none"/>

    <!-- Coconut Cluster at Crown -->
    <circle cx="247" cy="216" r="10" fill="url(#amberDrop)" stroke="#3D0E07" stroke-width="1.5"/>
    <circle cx="265" cy="216" r="10" fill="url(#amberDrop)" stroke="#3D0E07" stroke-width="1.5"/>
    <circle cx="256" cy="223" r="9.5" fill="url(#goldLinear)" stroke="#3D0E07" stroke-width="1.5"/>

    <!-- Heritage Oil Droplet Emblem at Center-Base -->
    <g transform="translate(256, 318)">
      <!-- Droplet Glow Halo -->
      <path d="M 0,-42 C -22, -10 -28, 12 0, 36 C 28, 12 22, -10 0, -42 Z" fill="#D4A853" opacity="0.25" filter="url(#goldGlow)"/>

      <!-- Golden Droplet Outer Shell -->
      <path d="M 0,-38 C -20, -8 -25, 12 0, 34 C 25, 12 20, -8 0, -38 Z" fill="url(#amberDrop)" stroke="url(#goldLinear)" stroke-width="3"/>

      <!-- Inner Coconut White Flesh / Virgin Purity Arc -->
      <path d="M 0,-26 C -14, -4 -17, 10 0, 26 C 17, 10 14, -4 0, -26 Z" fill="#FAF5EC" opacity="0.95"/>

      <!-- Golden Oil Core Reflection -->
      <path d="M 0,-16 C -8, 0 -10, 8 0, 18 C 10, 8 8, 0 0, -16 Z" fill="url(#goldLinear)"/>
      <ellipse cx="-4" cy="-2" rx="3" ry="6" transform="rotate(-20 -4 -2)" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Symmetrical Kerala Laurel Branches / Coconut Fronds at Base -->
    <g stroke="url(#goldLinear)" stroke-width="2" fill="none" stroke-linecap="round">
      <!-- Left Laurel Branch -->
      <path d="M 235,345 C 195,350 160,335 140,305"/>
      <path d="M 148,313 Q 140,305 142,295 Q 152,305 148,313 Z" fill="url(#goldLinear)"/>
      <path d="M 168,330 Q 158,322 158,312 Q 170,320 168,330 Z" fill="url(#goldLinear)"/>
      <path d="M 192,342 Q 182,335 180,325 Q 194,332 192,342 Z" fill="url(#goldLinear)"/>
      <path d="M 218,347 Q 208,342 204,333 Q 218,338 218,347 Z" fill="url(#goldLinear)"/>

      <!-- Right Laurel Branch -->
      <path d="M 277,345 C 317,350 352,335 372,305"/>
      <path d="M 364,313 Q 372,305 370,295 Q 360,305 364,313 Z" fill="url(#goldLinear)"/>
      <path d="M 344,330 Q 354,322 354,312 Q 342,320 344,330 Z" fill="url(#goldLinear)"/>
      <path d="M 320,342 Q 330,335 332,325 Q 318,332 320,342 Z" fill="url(#goldLinear)"/>
      <path d="M 294,347 Q 304,342 308,333 Q 294,338 294,347 Z" fill="url(#goldLinear)"/>
    </g>

    <!-- Traditional Heritage Ribbon Banner / Kozhikode Inscription -->
    <g transform="translate(0, 18)">
      <path d="M 170,366 Q 256,380 342,366 L 334,386 Q 256,400 178,386 Z" fill="#2A0703" stroke="url(#goldLinear)" stroke-width="1.8"/>
      <!-- Ribbon Swallowtail ends -->
      <path d="M 170,366 L 154,374 L 173,383 L 178,386 Z" fill="#3D0E07" stroke="url(#goldLinear)" stroke-width="1.5"/>
      <path d="M 342,366 L 358,374 L 339,383 L 334,386 Z" fill="#3D0E07" stroke="url(#goldLinear)" stroke-width="1.5"/>
      <text x="256" y="380" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" font-weight="bold" fill="url(#goldLinear)" text-anchor="middle" letter-spacing="4">KUTTIYADI • 100% PURE</text>
    </g>

  </g>

  <!-- Circular Outer Stars & Purity Seal -->
  <g fill="url(#goldLinear)">
    <!-- 5 Stars Cluster at Bottom -->
    <polygon points="256,420 258,426 264,426 259,430 261,436 256,432 251,436 253,430 248,426 254,426" transform="translate(0, -6)"/>
    <polygon points="236,423 238,428 243,428 239,432 241,437 236,433 232,437 234,432 229,428 234,428" transform="translate(0, -6) scale(0.85) translate(40, 70)"/>
    <polygon points="276,423 278,428 283,428 279,432 281,437 276,433 272,437 274,432 269,428 274,428" transform="translate(0, -6) scale(0.85) translate(46, 70)"/>
  </g>

</svg>
