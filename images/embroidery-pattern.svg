<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" fill="none">
    <defs>
        <!-- Diamond Cross-Stitch Lattice Pattern -->
        <pattern id="stitch-grid" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M0 8 L8 0 L16 8 L8 16 Z" fill="none" stroke="#9CA3AF" stroke-width="0.6" stroke-dasharray="1.5 2" opacity="0.25"/>
            <circle cx="8" cy="8" r="0.7" fill="#9CA3AF" opacity="0.3"/>
        </pattern>
        
        <!-- Embroidery Motif Def (Traditional Mankolam / Paisley Lace) -->
        <g id="paisley-motif">
            <!-- Mankolam / Paisley Leaf Outline with Stitches -->
            <path d="M0,0 C-18,-25 -28,-50 -20,-75 C-12,-95 10,-105 25,-90 C38,-78 35,-60 22,-45 C12,-32 18,-15 0,0 Z" 
                  fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 1.5"/>
            <!-- Inner Embroidered Petals -->
            <path d="M0,-8 C-12,-28 -18,-48 -12,-68 C-6,-82 10,-90 18,-78 C25,-68 20,-52 10,-38 C3,-28 8,-15 0,-8 Z" 
                  fill="none" stroke="#88909A" stroke-width="0.8" stroke-dasharray="2 1"/>
            <!-- Center Floral Rosette -->
            <circle cx="2" cy="-60" r="8" fill="none" stroke="#A8AFB8" stroke-width="1" stroke-dasharray="2 1.5"/>
            <circle cx="2" cy="-60" r="3" fill="#9CA3AF"/>
            <!-- Radiating Petal Stitches -->
            <path d="M2,-72 L2,-68 M2,-48 L2,-52 M-10,-60 L-6,-60 M14,-60 L10,-60 M-6,-68 L-4,-66 M10,-52 L8,-54 M-6,-52 L-4,-54 M10,-68 L8,-66" 
                  stroke="#9CA3AF" stroke-width="1"/>
            <!-- Leaf Tendril Swirls -->
            <path d="M22,-45 C35,-35 40,-18 30,-5 C24,4 12,2 5,-4" 
                  fill="none" stroke="#9CA3AF" stroke-width="0.9" stroke-dasharray="2.5 1.5"/>
            <circle cx="5" cy="-4" r="1.5" fill="#9CA3AF"/>
        </g>

        <!-- Floral Lace Border Element -->
        <g id="lace-scallop">
            <path d="M0,240 C20,225 35,225 55,240 C75,225 90,225 110,240" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3 1.5"/>
            <path d="M0,234 C20,220 35,220 55,234 C75,220 90,220 110,234" fill="none" stroke="#88909A" stroke-width="0.8"/>
            <circle cx="27.5" cy="227" r="2.5" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
            <circle cx="82.5" cy="227" r="2.5" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
        </g>
    </defs>

    <!-- Background Cross-Stitch Mesh -->
    <rect width="320" height="240" fill="url(#stitch-grid)"/>

    <!-- Horizontal Decorative Embroidery Bands -->
    <line x1="0" y1="210" x2="320" y2="210" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 2"/>
    <line x1="0" y1="205" x2="320" y2="205" stroke="#808892" stroke-width="0.6"/>
    <line x1="0" y1="200" x2="320" y2="200" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="1.5 2.5"/>

    <!-- Running Chain Stitch Wave -->
    <path d="M0,195 Q20,185 40,195 T80,195 T120,195 T160,195 T200,195 T240,195 T280,195 T320,195" 
          fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="2.5 1.5"/>
    <path d="M0,191 Q20,181 40,191 T80,191 T120,191 T160,191 T200,191 T240,191 T280,191 T320,191" 
          fill="none" stroke="#808892" stroke-width="0.6"/>

    <!-- Eyelet Lace Circles along Wave -->
    <circle cx="20" cy="189" r="2" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
    <circle cx="60" cy="197" r="2" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
    <circle cx="100" cy="189" r="2" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
    <circle cx="140" cy="197" r="2" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
    <circle cx="180" cy="189" r="2" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
    <circle cx="220" cy="197" r="2" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
    <circle cx="260" cy="189" r="2" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
    <circle cx="300" cy="197" r="2" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>

    <!-- Central Paisley Embroidery Motifs (Repeating across 320px) -->
    <g transform="translate(80, 180)">
        <use href="#paisley-motif"/>
    </g>
    <g transform="translate(240, 180)">
        <use href="#paisley-motif"/>
    </g>

    <!-- Inverted Paisley / Floral Fillers -->
    <g transform="translate(0, 180)">
        <use href="#paisley-motif"/>
    </g>
    <g transform="translate(320, 180)">
        <use href="#paisley-motif"/>
    </g>

    <g transform="translate(160, 175) scale(-0.7, 0.7)">
        <use href="#paisley-motif"/>
    </g>

    <!-- Fine Interconnecting Embroidered Vines & Florets -->
    <path d="M0,140 C40,115 60,155 100,135 C140,115 180,155 220,135 C260,115 280,155 320,140" 
          fill="none" stroke="#8E959E" stroke-width="0.9" stroke-dasharray="3 2"/>

    <!-- Embroidered Florets -->
    <g transform="translate(40, 125)">
        <circle cx="0" cy="0" r="4" fill="none" stroke="#9CA3AF" stroke-width="0.9" stroke-dasharray="1.5 1"/>
        <circle cx="0" cy="0" r="1.5" fill="#9CA3AF"/>
        <path d="M0,-8 L0,-4 M0,8 L0,4 M-8,0 L-4,0 M8,0 L4,0" stroke="#9CA3AF" stroke-width="0.8"/>
    </g>
    <g transform="translate(120, 125)">
        <circle cx="0" cy="0" r="4" fill="none" stroke="#9CA3AF" stroke-width="0.9" stroke-dasharray="1.5 1"/>
        <circle cx="0" cy="0" r="1.5" fill="#9CA3AF"/>
        <path d="M0,-8 L0,-4 M0,8 L0,4 M-8,0 L-4,0 M8,0 L4,0" stroke="#9CA3AF" stroke-width="0.8"/>
    </g>
    <g transform="translate(200, 125)">
        <circle cx="0" cy="0" r="4" fill="none" stroke="#9CA3AF" stroke-width="0.9" stroke-dasharray="1.5 1"/>
        <circle cx="0" cy="0" r="1.5" fill="#9CA3AF"/>
        <path d="M0,-8 L0,-4 M0,8 L0,4 M-8,0 L-4,0 M8,0 L4,0" stroke="#9CA3AF" stroke-width="0.8"/>
    </g>
    <g transform="translate(280, 125)">
        <circle cx="0" cy="0" r="4" fill="none" stroke="#9CA3AF" stroke-width="0.9" stroke-dasharray="1.5 1"/>
        <circle cx="0" cy="0" r="1.5" fill="#9CA3AF"/>
        <path d="M0,-8 L0,-4 M0,8 L0,4 M-8,0 L-4,0 M8,0 L4,0" stroke="#9CA3AF" stroke-width="0.8"/>
    </g>

    <!-- Top Hemstitch Line (fades towards top) -->
    <line x1="0" y1="90" x2="320" y2="90" stroke="#8E959E" stroke-width="0.75" stroke-dasharray="2 3"/>
    <path d="M0,85 Q10,80 20,85 T40,85 T60,85 T80,85 T100,85 T120,85 T140,85 T160,85 T180,85 T200,85 T220,85 T240,85 T260,85 T280,85 T300,85 T320,85" 
          fill="none" stroke="#808892" stroke-width="0.6" stroke-dasharray="1.5 2"/>

    <!-- Bottom Scalloped Lace Hem -->
    <use href="#lace-scallop" x="0"/>
    <use href="#lace-scallop" x="110"/>
    <use href="#lace-scallop" x="220"/>
</svg>
