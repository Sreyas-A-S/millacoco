<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millacoco Admin - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF5EC; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-[#3a0e07]">
    <div class="w-full max-w-md bg-white rounded-3xl p-8 border border-[#D4A853]/40 shadow-xl">
        <!-- Brand Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-[#1C3822] border border-[#D4A853]/40 flex items-center justify-center p-2 mb-3 shadow">
                <img src="/images/logo_gold.png" alt="Millacoco Logo" class="w-full h-full object-contain">
            </div>
            <h1 class="font-serif text-2xl font-bold tracking-wider text-[#611B10]">MILLACOCO</h1>
            <span class="text-[10px] tracking-[0.25em] text-[#D4A853] font-semibold uppercase block mt-0.5">Admin Management</span>
        </div>

        <!-- Alert Notification -->
        <div id="login-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold bg-rose-50 border border-rose-200 text-rose-800"></div>

        <!-- Login Form -->
        <form id="admin-login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-[#611B10] mb-1.5 uppercase tracking-wider">Email Address</label>
                <input type="email" id="email" required placeholder="admin@millacoco.com" class="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-[#D4A853] text-xs">
            </div>

            <div>
                <label class="block text-xs font-bold text-[#611B10] mb-1.5 uppercase tracking-wider">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-[#D4A853] text-xs">
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3.5 px-4 rounded-xl bg-[#611B10] hover:bg-[#782315] text-[#D4A853] font-bold text-xs uppercase tracking-wider transition shadow-md active:scale-95">
                Sign In to Admin
            </button>
        </form>

        <p class="text-[10px] text-center text-stone-400 mt-6 tracking-wide">
            Protected by Slim 4 & JWT • Millacoco Pure Kerala Oil
        </p>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const alertBox = document.getElementById('login-alert');
            
            btn.disabled = true;
            btn.innerText = 'Verifying...';
            alertBox.classList.add('hidden');

            try {
                const res = await fetch('/admin/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    // Save token to sessionStorage for API requests
                    sessionStorage.setItem('admin_jwt', data.token);
                    window.location.href = '/admin';
                } else {
                    alertBox.textContent = data.message || 'Authentication failed.';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.textContent = 'Network or server connection error.';
                alertBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Sign In to Admin';
            }
        }
    </script>
</body>
</html>
