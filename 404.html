<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Millacoco</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
    <link rel="alternate icon" type="image/png" href="/images/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF5EC; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-[#3a0e07] antialiased selection:bg-[#D4A853]/30">

    <!-- Minimal Header -->
    <header class="max-w-[1440px] mx-auto w-full px-6 py-6">
        <a href="/index.html" class="inline-flex items-center space-x-3 group">
            <div class="w-10 h-10 rounded-2xl bg-[#1C3822] border border-[#D4A853]/40 flex items-center justify-center p-1 group-hover:scale-105 transition-transform duration-300 shadow-sm">
                <img src="/images/logo_gold.png" alt="Millacoco Logo" class="w-full h-full object-contain">
            </div>
            <div class="text-left">
                <span class="font-serif text-2xl font-extrabold tracking-[0.22em] text-[#611B10] uppercase block leading-none">MILLACOCO</span>
                <span class="text-[9px] tracking-[0.38em] text-[#1C3822] font-semibold uppercase block mt-1">Pure Kerala Coconut Oil</span>
            </div>
        </a>
    </header>

    <!-- Main 404 Content -->
    <main class="flex-1 flex items-center justify-center p-6 text-center">
        <div class="max-w-md w-full bg-white/80 backdrop-blur-md rounded-[2.5rem] p-8 sm:p-12 border border-[#D4A853]/30 shadow-xl">
            <!-- 404 Badge -->
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-[#611B10] text-[#D4A853] text-2xl font-serif font-bold shadow-md mb-6 border border-[#D4A853]/40">
                404
            </div>

            <h1 class="font-serif text-2xl sm:text-3xl font-bold text-[#611B10] mb-3">
                Page Not Found
            </h1>
            <p class="text-xs sm:text-sm text-stone-600 leading-relaxed mb-8">
                The page or product link you are looking for doesn't exist or may have been moved.
            </p>

            <!-- Navigation Buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <a href="/index.html" class="w-full sm:w-auto px-6 py-3 rounded-full bg-[#611B10] hover:bg-[#782315] text-[#D4A853] hover:text-white text-xs font-bold uppercase tracking-wider transition shadow-sm active:scale-95">
                    Return Home
                </a>
                <a href="/products.html" class="w-full sm:w-auto px-6 py-3 rounded-full bg-white hover:bg-stone-50 text-[#611B10] border border-[#D4A853]/50 text-xs font-bold uppercase tracking-wider transition shadow-sm active:scale-95">
                    View Products
                </a>
            </div>
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="py-6 text-center text-[11px] text-stone-500">
        &copy; 2026 Millacoco Coconut Oil • Puthalampurath Oil Mill, Kozhikode
    </footer>

</body>
</html>
